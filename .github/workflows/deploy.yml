name: Deploy isolated mobile preview

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: xuanshu-mobile-preview
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy mobile preview
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install and verify
        run: |
          npm ci
          npm run lint

      - name: Build isolated standalone package
        env:
          NEXT_PUBLIC_ASSET_PREFIX: /xuanshu-assets
        run: |
          npm run build
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -R public .next/standalone/public; fi
          tar -C .next/standalone -czf /tmp/xuanshu-mobile-${GITHUB_SHA}.tar.gz .

      - name: Start ssh agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust server host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_SSH_PORT || '22' }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload private runtime configuration
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          test -n "$DEEPSEEK_API_KEY"
          umask 077
          printf '%s\n' \
            'AI_PROVIDER=deepseek' \
            "DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY" \
            'AI_BASE_URL=https://api.deepseek.com' \
            'AI_MODEL=deepseek-chat' \
            'AI_TIMEOUT_MS=30000' \
            'NARRATIVE_MODEL=deepseek-chat' \
            'NARRATIVE_AI_ENABLED=true' \
            'CHAT_MODEL=deepseek-chat' \
            'CHAT_AI_ENABLED=true' \
            'NEXT_PUBLIC_NARRATIVE_API_ENABLED=true' \
            'AI_FORCE_LOCAL=false' \
            'AI_FALLBACK_ON_ERROR=true' \
            'RATE_LIMIT_CHAT_DAILY=10' \
            'RATE_LIMIT_CHAT_WRITE=12' \
            > /tmp/xuanshu-mobile.env
          scp \
            -o IPQoS=none \
            -o BatchMode=yes \
            -P "${{ secrets.DEPLOY_SSH_PORT || '22' }}" \
            /tmp/xuanshu-mobile.env \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/xuanshu-mobile.env"
          ssh \
            -o IPQoS=none \
            -o BatchMode=yes \
            -p "${{ secrets.DEPLOY_SSH_PORT || '22' }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "umask 077; mkdir -p /opt/xuanshu-mobile-preview/shared; install -m 600 /tmp/xuanshu-mobile.env /opt/xuanshu-mobile-preview/shared/app.env; rm -f /tmp/xuanshu-mobile.env"
          rm -f /tmp/xuanshu-mobile.env

      - name: Upload standalone package
        run: |
          scp \
            -o IPQoS=none \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -P "${{ secrets.DEPLOY_SSH_PORT || '22' }}" \
            /tmp/xuanshu-mobile-${GITHUB_SHA}.tar.gz \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/xuanshu-mobile-${GITHUB_SHA}.tar.gz"

      - name: Install isolated service and routes
        run: |
          ssh \
            -o IPQoS=none \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -p "${{ secrets.DEPLOY_SSH_PORT || '22' }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "RELEASE_SHA='${GITHUB_SHA}' ARTIFACT='/tmp/xuanshu-mobile-${GITHUB_SHA}.tar.gz' bash -s" \
            < deploy/server-deploy-mobile-preview.sh

      - name: Public HTTPS checks
        run: |
          for path in / /m /m/report/bazi /m/report/zodiac /m/chart/natal /m/chart/transit /api/health; do
            curl --retry 8 --retry-delay 5 --retry-all-errors -fsS -o /dev/null "https://zzj-superstaff.duckdns.org${path}"
          done
          curl -fsS https://zzj-superstaff.duckdns.org/m | grep -q '/xuanshu-assets/_next/'
