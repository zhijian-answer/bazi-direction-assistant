- description: 金为主要力量时要写出边界和标准的生活场景
  vars:
    context: 生辰
    facts: "庚金日主；金为主要力量；水相对较少；规则模糊会增加消耗"
    fallback: "先明确标准和边界，再做取舍。今天先写清楚一件事的完成标准。"

- description: 火为主要力量时避免抽象地谈表达倾向
  vars:
    context: 生辰
    facts: "丙火日主；火为主要力量；只有投入没有反馈时容易消耗"
    fallback: "主动表达与推动事情被看见。今天先完成一个能获得反馈的小任务。"

- description: 木为主要力量时体现成长停滞的真实感受
  vars:
    context: 生辰
    facts: "甲木日主；木为主要力量；方向长期停滞会降低投入感"
    fallback: "持续学习与建立连接。今天给停滞的事情补一条新信息。"

- description: 双子太阳与白羊月亮要体现交流和快速情绪反馈
  vars:
    context: 星座
    facts: "太阳双子；月亮白羊；上升金牛；需要新鲜交流；情绪反应较快；外在相对稳定"
    fallback: "看起来稳定，内心需要变化、表达和快速反馈。"

- description: 巨蟹太阳要避免把敏感写成弱点
  vars:
    context: 星座
    facts: "太阳巨蟹；容易先注意关系温度；需要稳定回应；不确定时会先观察"
    fallback: "你会先记住一个人的感受，再决定靠近多少。"

- description: 摩羯太阳要出现先做事后表达的生活方式
  vars:
    context: 星座
    facts: "太阳摩羯；重视长期结果；习惯用持续行动表达投入"
    fallback: "先把事情做好，再慢慢说自己的感受。"

- description: 紫微工作线索要先写用户可辨认的行为
  vars:
    context: 紫微
    facts: "身宫落在工作相关领域；重点星曜强调责任与收束；稳定条件是目标明确和反馈持续"
    fallback: "确认值得投入以后，行动会比较稳定。今天先完成一个能获得反馈的关键任务。"

- description: 紫微关系线索不能断言结果
  vars:
    context: 紫微
    facts: "关系领域重视稳定回应；含糊信息会增加反复确认；事实和行动比猜测重要"
    fallback: "先确认事实，再决定投入多少。"

- description: 资料不足时必须承认边界
  vars:
    context: 星座
    facts: "只能确认太阳双鱼；出生时辰未知；月亮和上升不下结论"
    fallback: "你很容易接住别人的情绪。月亮和上升需要补充出生时辰后再看。"

- description: 高压阶段不能制造恐惧
  vars:
    context: 流盘
    facts: "外部要求增加；同时处理的事情偏多；适合先抓一条主线；不预测具体事件"
    fallback: "最近事情来得快，先守住最重要的一件。"
